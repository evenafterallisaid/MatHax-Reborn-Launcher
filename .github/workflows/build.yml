name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore --locked-mode
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Publish self-contained launcher
        run: dotnet publish -c Release -r win-x64 --self-contained true --no-restore -o publish
      - uses: actions/upload-artifact@v7
        with:
          name: mathax-reborn-launcher-win-x64
          path: publish/
          if-no-files-found: error
